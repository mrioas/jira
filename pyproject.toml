[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira"
version = "0.1.0"
description = "A CLI application."
readme = "README.md"
authors = [{ name = "Mario Aguilar", email = "marioas@proton.me" }]
dependencies = [
    "click >= 8.1.3",
]

[project.scripts]
jira = "jira.__main__:cli"
